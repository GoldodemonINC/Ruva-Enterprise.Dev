[package]
name = "ruva"
version = "0.1.0"
edition = "2021"
description = "Ruva language compiler — Java structure, Rust power, zero-cost safety"
authors = ["Ruva Contributors"]

[[bin]]
name = "ruva"
path = "src/main.rs"

[[bin]]
name = "rgu"
path = "src/bin/rgu.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
